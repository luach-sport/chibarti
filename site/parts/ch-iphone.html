      <p class="intro">חיברתי היא לאנדרואיד בלבד. באייפון, אפל לא נותנת לאפליקציה שלא מהחנות שלה (וגם לא לאתר במסך הבית) ליצור רשת Wi-Fi ישירה, לצלם את המסך ולשדר אותו, או לשמור קבצים ישר לטלפון. בלי זה אין חיבור ישיר, ולכן אין גרסה לאייפון.</p>
